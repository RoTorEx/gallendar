name: Build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Check, package and smoke install
        env:
          TARGET: ${{ matrix.target }}
          DIST_DIR: ${{ runner.temp }}/gallendar-dist
          GALLENDAR_RELEASE_REPO: ${{ github.repository }}
        run: |
          make check
          make smoke-install
      - uses: actions/upload-artifact@v6
        with:
          name: gallendar-${{ matrix.asset }}
          path: ${{ runner.temp }}/gallendar-dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: assets
          pattern: gallendar-*
          merge-multiple: true
      - name: Include installer
        run: cp scripts/install.sh assets/gallendar-install.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
