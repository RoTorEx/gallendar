# Copy with `gallendar init`; edit IDs and credential path before using Google.
# Relative paths are resolved relative to this config file.
# Two authentication modes: "service_account" (existing default) or "oauth".
# Individual [[accounts]] may override auth for mixed access.
auth = "service_account"
service_account_key = "secrets/service-account.json"
# Keep this stable. Changing it makes existing clones belong to another instance.
namespace = "gallendar-work"
# Optional: resolve a separate calendar by its exact name in each destination account.
# Requires destination OAuth; omit target IDs when enabled.
# mirror_calendar_name = "Gallendar"
# Check for a newer GitHub Release in the background, once per day on use.
auto_update = true
# Explicit operator choices.
# Rolling window from now, configurable from 1 to 30 days.
horizon_days = 7
# Seconds between pass starts; 600 seconds = 10 minutes. Restart run after editing.
poll_seconds = 600
# "out_of_office_only": skip other all-day events.
# "busy": include all-day Busy events, excluding birthday and workingLocation types.
all_day_policy = "out_of_office_only"

# For OAuth, set auth = "oauth" above and uncomment this section.
# Download a Google OAuth Desktop app client; this is not a service-account key.
# [oauth]
# client = "secrets/oauth-client.json"
# tokens_dir = "secrets/oauth"

# Mirrors Busy intervals only, following moves and deletions.
[[accounts]]
name = "aveni"
owner_email = "REPLACE-AVENI@example.com"
source = "REPLACE-AVENI-CALENDAR-ID"

[[accounts]]
name = "thira"
owner_email = "REPLACE-THIRA@example.com"
source = "REPLACE-THIRA-CALENDAR-ID"

[[accounts]]
name = "innowise"
owner_email = "REPLACE-INNOWISE@example.com"
target = "REPLACE-INNOWISE-CALENDAR-ID"

[[routes]]
from = "aveni"
to = "innowise"
# "masked" uses title; "original" preserves the source event title only.
mode = "masked"
title = "Busy"
# Literal text prepended to either original or masked title; include a separator.
prefix = ""
# Invite only these colleagues to this route's copies; requires destination OAuth.
attendees = []

[[routes]]
from = "thira"
to = "innowise"
# "masked" uses title; "original" preserves the source event title only.
mode = "masked"
title = "Busy"
# Literal text prepended to either original or masked title; include a separator.
prefix = ""
# Invite only these colleagues to this route's copies; requires destination OAuth.
attendees = []
