[package]
name = "gallendar"
version = "0.2.4"
edition = "2024"
description = "Private busy-time synchronization between shared Google calendars"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
